# workflow-catalog.yaml — UE 游戏开发 7 阶段管线（单一事实源）
#
# 被 /start、/project-stage-detect、gate-check 等技能引用。
# 阶段门为 ADVISORY（建议性），不硬阻断；用户始终有最终决定权（CCGS 约定移植）。

schema_version: 1
description: UE 游戏开发 7 阶段管线定义。每阶段列出关键技能、必需产物（artifact）与进入下一阶段的门条件。
source: CCGS 7-phase workflow-catalog 蒸馏适配（opencode/SEA 平台）

phases:
  - id: 1-concept
    name: 概念与愿景
    artifact_glob: "design/gdd/game-concept.md"
    skills: [start, setup-engine, brainstorm, project-stage-detect]
    exit_gate: "game-concept.md 存在且含核心循环定义"

  - id: 2-systems-design
    name: 系统设计
    artifact_glob: "design/gdd/systems-index.md"
    skills: [design-system, design-review, consistency-check, balance-check]
    exit_gate: "systems-index.md 存在，各系统 GDD 无缺失必节"

  - id: 3-technical-setup
    name: 技术架构
    artifact_glob: "docs/architecture/*.adr.md"
    skills: [create-architecture, architecture-decision, architecture-review]
    exit_gate: "≥1 个 ADR 已记录，技术选型有版本锚定"

  - id: 4-pre-production
    name: 预生产
    artifact_glob: "prototypes/*/README.md"
    skills: [prototype, vertical-slice, ux-design, create-stories]
    exit_gate: "原型/垂直切片已验证核心循环，UX 规格完成"

  - id: 5-production
    name: 量产
    artifact_glob: "production/sprints/current.md"
    skills: [create-epics, create-stories, dev-story, code-review, sprint-plan]
    exit_gate: "冲刺产物通过 story-done + gate-check"

  - id: 6-polish
    name: 打磨
    artifact_glob: "production/polish/perf-report.md"
    skills: [perf-profile, regression-suite, smoke-check, balance-check]
    exit_gate: "性能基准达标，零 S1/S2 或已批准例外"

  - id: 7-release
    name: 发布
    artifact_glob: "production/releases/*.md"
    skills: [release-checklist, launch-checklist, changelog, hotfix]
    exit_gate: "release-checklist 通过，Go/No-Go 签字齐全"

review_modes:
  full: 全部门评审（Tier1+2+3）
  lean: 仅阶段门（默认）
  solo: 无门禁（单人原型）